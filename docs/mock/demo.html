<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>栖衡 · 酒店收益诊断 Demo</title>
  <style>
:root { --ink:#222c2c; --muted:#6b7775; --accent:#17685e; --line:#e6eae7; --paper:#fff; --bg:#f6f7f5; --warm:#fff7e8; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:var(--bg); font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
button,input,select,textarea { font:inherit; }
button,a,input,select,textarea { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; border:0; border-radius:10px; padding:10px 18px; background:transparent; color:var(--ink); font-weight:600; }
button:disabled { cursor:not-allowed; opacity:.45; }
button:hover:not(:disabled) { filter:brightness(.95); }
:focus-visible { outline:3px solid #8ab6ad; outline-offset:3px; }
a { color:var(--accent); text-decoration:none; }
h1,h2,h3,p { margin-top:0; }
h1 { font-size:34px; letter-spacing:-1px; line-height:1.25; margin-bottom:12px; }
h2 { font-size:20px; margin-bottom:12px; }
h3 { font-size:16px; margin-bottom:8px; }
small,.small { font-size:12px; }
.muted { color:var(--muted); }
.eyebrow { font-size:10px; font-weight:700; letter-spacing:2px; color:var(--muted); margin-bottom:12px; }
.demo-banner { text-align:center; background:#e9efeb; color:#37574e; padding:7px 14px; font-size:11px; letter-spacing:.5px; }
.topbar { height:90px; padding:0 38px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:white; gap:18px; }
.brand { display:flex; gap:12px; align-items:center; color:var(--ink); font-size:23px; font-weight:650; letter-spacing:3px; }
.brand small { display:block; font-size:8px; letter-spacing:2px; color:var(--muted); }
.brand-mark { display:grid; place-items:center; width:42px; height:42px; background:var(--accent); color:white; border-radius:13px; font-size:20px; letter-spacing:0; }
.role-switch { display:flex; border-radius:12px; padding:4px; background:#f0f2ef; }
.role-switch button { font-size:13px; padding:8px 20px; }
.role-switch button[aria-pressed=true] { background:white; box-shadow:0 2px 5px #23362a0a; color:var(--accent); }
.quiet { color:var(--muted); font-size:12px; }
.app-layout { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:calc(100vh - 121px); }
.sidebar { padding:32px 22px; border-right:1px solid var(--line); background:#fcfcfb; }
.sidebar label { font-size:12px; color:var(--muted); display:block; }
select,input,textarea { width:100%; border:1px solid #d9dfdb; background:white; padding:11px 12px; border-radius:9px; color:var(--ink); }
.sidebar select { margin:8px 0; }
nav { margin-top:28px; display:flex; flex-direction:column; gap:7px; }
nav button { text-align:left; font-weight:500; font-size:13px; padding:12px; }
nav button.active { background:#e7f0ea; color:var(--accent); font-weight:650; }
.nav-number { display:inline-block; width:26px; font-size:11px; opacity:.55; }
.sidebar-note { border-top:1px solid var(--line); margin-top:42px; padding-top:23px; font-size:12px; color:var(--muted); }
.sidebar-note p { font-size:11px; margin-top:10px; }
.status-dot { display:inline-block; width:7px; height:7px; background:#a77935; border-radius:50%; margin-right:7px; }
main { padding:36px 42px 60px; max-width:1440px; width:100%; margin:0 auto; }
.page-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:25px; }
.page-heading p { max-width:650px; margin-bottom:0; }
.pill { white-space:nowrap; display:inline-block; padding:4px 10px; border-radius:30px; font-size:11px; font-weight:600; background:#edf1ee; color:#62736c; }
.pill.green { background:#e8f3ed; color:#17634e; }
.pill.amber { background:#fff1d8; color:#87601a; }
.pill.red { background:#fbece7; color:#954434; }
.hero { position:relative; overflow:hidden; background:#e7ede5; border-radius:20px; padding:30px; min-height:200px; margin-bottom:24px; }
.hero h2 { font-size:28px; font-weight:550; max-width:550px; line-height:1.45; }
.hero p { max-width:520px; color:#576b61; }
.hero::after { content:""; width:270px; height:270px; border:45px solid #91a99422; border-radius:50%; position:absolute; right:-70px; top:-45px; pointer-events:none; }
.primary { background:var(--accent); color:white; }
.secondary { background:white; border:1px solid #dbe2dc; }
.danger { background:#fbece7; color:#944434; }
.button-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:18px; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-bottom:22px; }
.grid.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
.grid.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
.card { background:white; border:1px solid var(--line); border-radius:16px; padding:24px; min-width:0; margin-bottom:20px; }
.grid > .card { margin-bottom:0; }
.metric-label { color:var(--muted); font-size:12px; }
.metric-value { display:block; font-size:32px; font-weight:600; line-height:1.4; letter-spacing:-1px; margin:10px 0; }
.metric-meta { font-size:11px; color:var(--muted); }
.section-heading { display:flex; align-items:center; justify-content:space-between; margin:28px 0 15px; gap:10px; }
.section-heading h2 { margin:0; }
.hotel-card { position:relative; }
.hotel-initial { width:45px; height:45px; border-radius:14px; display:grid; place-items:center; font-size:20px; margin-bottom:20px; background:#edf0e7; color:#66775b; }
.hotel-card h3 { font-size:18px; }
.hotel-card .pill { position:absolute; top:24px; right:24px; }
.notice { padding:16px 20px; background:#edf3ee; border-radius:12px; font-size:13px; margin:0 0 22px; }
.notice.warning { background:var(--warm); color:#7c5b29; }
.notice.error { background:#fcece7; color:#953e2f; }
.notice p:last-child { margin-bottom:0; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; text-align:left; font-size:13px; }
th { font-size:11px; color:var(--muted); font-weight:500; background:#fafbf9; }
td,th { padding:15px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
td input { min-width:130px; max-width:200px; }
.steps { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0; }
.step { border-top:3px solid #dfe6df; padding-top:12px; font-size:12px; color:var(--muted); }
.step.done { border-color:var(--accent); color:var(--accent); }
.step b { display:block; margin-bottom:4px; }
.fact-list { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.fact-list dt { color:var(--muted); font-size:12px; }
.fact-list dd { margin:4px 0 0; font-weight:600; }
.evidence { background:#f7f4ed; padding:24px; border-radius:12px; border:1px dashed #d5cbb8; font-family:ui-monospace,monospace; }
.evidence-line { padding:12px 0; border-bottom:1px solid #ded8cd; display:flex; justify-content:space-between; gap:16px; }
.evidence .stamp { margin-top:22px; font-size:11px; color:#8a7d62; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
.check-label { display:flex; align-items:flex-start; gap:10px; }
.check-label input { width:auto; margin-top:6px; }
.form-error { color:#a44332; font-size:13px; margin-top:14px; }
.result { background:#edf3ee; border-radius:14px; padding:24px; margin-top:20px; }
.result .metric-value { color:var(--accent); }
.bar-row { display:grid; grid-template-columns:90px 1fr 55px; align-items:center; gap:15px; margin:15px 0; font-size:12px; }
.bar { height:9px; background:#eef2ed; border-radius:10px; overflow:hidden; }
.bar span { display:block; height:100%; background:#599285; border-radius:10px; }
.empty { padding:40px 24px; text-align:center; }
.empty h2 { font-size:23px; }
.action-item { border-bottom:1px solid var(--line); padding:16px 0; display:flex; gap:14px; font-size:13px; }
.action-item span { color:var(--accent); font-weight:700; }
.report-watermark { color:#aa8170; font-size:12px; letter-spacing:2px; border-bottom:1px dashed #e1d4cc; padding-bottom:12px; margin-bottom:20px; }
.timeline { padding-left:18px; border-left:2px solid #e3e9e3; }
.timeline p { font-size:12px; }
.feedback-text { white-space:pre-wrap; overflow-wrap:anywhere; }
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#243d35; color:white; padding:13px 24px; border-radius:12px; box-shadow:0 8px 30px #0002; max-width:90vw; z-index:10; font-size:13px; }
dialog { border:1px solid var(--line); border-radius:20px; padding:28px; max-width:460px; width:90%; }
dialog::backdrop { background:#182d2855; }
.footer-note { margin-top:25px; font-size:11px; color:var(--muted); }
[hidden] { display:none !important; }
body.owner .app-layout { grid-template-columns:210px minmax(0,1fr); }
body.owner main { max-width:1050px; }
@media (max-width:1100px) {
  main { padding:28px 24px; }
  .grid.four { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grid { gap:12px; }
}
@media (max-width:760px) {
  .topbar { padding:14px 16px; height:auto; flex-wrap:wrap; gap:12px; }
  .brand { font-size:20px; }
  .role-switch { order:3; width:100%; }
  .role-switch button { flex:1; }
  .app-layout,body.owner .app-layout { display:block; }
  .sidebar { padding:18px 16px 0; border-right:0; border-bottom:1px solid var(--line); }
  .sidebar .eyebrow,.sidebar-note { display:none; }
  .sidebar select { max-width:100%; }
  nav { flex-direction:row; overflow-x:auto; margin-top:12px; padding:0 0 10px; gap:4px; }
  nav button { white-space:nowrap; font-size:12px; padding:10px; flex-shrink:0; }
  .nav-number { display:none; }
  main { padding:24px 16px 40px; }
  h1 { font-size:28px; }
  .hero { padding:24px; }
  .hero h2 { font-size:24px; }
  .grid,.grid.two,.form-grid { grid-template-columns:1fr; }
  .grid.four { grid-template-columns:1fr 1fr; }
  .metrics { grid-template-columns:1fr; }
  .card { padding:20px; }
  .page-heading { flex-direction:column; gap:10px; }
  .metric-value { font-size:28px; }
  .steps { gap:8px; }
  .step { font-size:10px; }
  .fact-list { gap:14px; }
}
@media print {
  .demo-banner,.topbar,.sidebar,.button-row,.footer-note,#toast,#storage-warning,.no-print { display:none !important; }
  .app-layout,body.owner .app-layout { display:block; }
  main { padding:0; max-width:none; }
  .card { break-inside:avoid; box-shadow:none; }
  .report-watermark { color:#555; }
  body { background:white; }
}
</style>
</head>
<body>
  <div class="demo-banner">交互原型 · 全部为合成数据 · 无真实 OCR、鉴权或经营操作</div>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="栖衡首页"><span class="brand-mark">栖</span><span>栖衡<small>REVENUE STUDIO</small></span></a>
    <div class="role-switch" aria-label="演示身份">
      <button type="button" data-role="consultant" aria-pressed="true">顾问工作台</button>
      <button type="button" data-role="owner" aria-pressed="false">业主端</button>
    </div>
    <button type="button" id="reset" class="quiet">重置演示</button>
  </header>
  <div id="storage-warning" class="notice warning" hidden></div>
  <div class="app-layout">
    <aside class="sidebar">
      <p class="eyebrow">WORKSPACE / 演示空间</p>
      <label for="hotel-picker">当前酒店</label>
      <select id="hotel-picker"></select>
      <div id="hotel-caption" class="muted small"></div>
      <nav id="navigation" aria-label="主要导航"></nav>
      <div class="sidebar-note"><span class="status-dot"></span> 规则尚未冻结<p>让事实可见，让决策有据。<br>不自动推荐涨价或承诺收益。</p></div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="reset-dialog">
    <h2>重新开始演示？</h2>
    <p>仅清除本 Demo 的本地进度，恢复四家虚构酒店。不会修改项目或其他网站的数据。</p>
    <div class="button-row"><button type="button" id="cancel-reset" class="secondary">保留进度</button><button type="button" id="confirm-reset" class="primary">确认重置</button></div>
  </dialog>
  <noscript>此静态交互 Demo 需要启用 JavaScript；不会向第三方发送数据。</noscript>
<script>
(function (root) {
  "use strict";
  const STORAGE_KEY = "revenue-diagnostic-demo-v1";
  const fieldLabels = {
    available: "可售房晚", sold: "售出房晚", revenue: "客房收入"
  };
  const clone = (value) => JSON.parse(JSON.stringify(value));
  function createState() {
    const base = {
      period: "2026-10-01 至 2026-10-30", rooms: 100, days: 30,
      revision: 1, intake: null, consent: false, reports: [], feedback: [],
      comparisons: null,
      channels: { revenue: 352800, commission: 42336, ads: 12000 },
      fields: {
        available: { value: 3000, confirmed: true },
        sold: { value: 2100, confirmed: false },
        revenue: { value: 588000, confirmed: false }
      }
    };
    return {
      version: 1, role: "consultant", hotelId: "A", page: "home",
      hotels: [
        { ...clone(base), id: "A", name: "云栖城市酒店", city: "杭州 · 城市商旅", caseLabel: "完整流程", invitation: "accepted" },
        { ...clone(base), id: "B", name: "溪岸小筑", city: "苏州 · 精品住宿", caseLabel: "资料不足", invitation: "pending",
          rooms: 60, fields: { available: { value: 1800, confirmed: true }, sold: { value: null, confirmed: false }, revenue: { value: null, confirmed: false } },
          channels: { revenue: null, commission: null, ads: null } },
        { ...clone(base), id: "C", name: "观澜商旅酒店", city: "宁波 · 城市商旅", caseLabel: "有同期 / 缺竞品", invitation: "accepted",
          fields: { available: { value: 3000, confirmed: true }, sold: { value: 2100, confirmed: true }, revenue: { value: 588000, confirmed: true } },
          comparisons: [
            { label: "去年同周期", available: 3000, sold: 2250, revenue: 652500 },
            { label: "上月同长度周期", available: 3000, sold: 2040, revenue: 550800 }
          ] },
        { ...clone(base), id: "D", name: "山隐度假酒店", city: "湖州 · 度假住宿", caseLabel: "授权已撤销", invitation: "revoked" }
      ].map((hotel) => ({ ...hotel, evidenceFields: clone(hotel.fields) }))
    };
  }
  function canAccess(hotel, role) {
    return role === "owner" || (role === "consultant" && hotel.invitation === "accepted");
  }
  function requireAccess(hotel, role) {
    if (!canAccess(hotel, role)) throw new Error("酒店授权未生效，不能访问或操作经营资料。");
  }
  function getMetrics(hotel) {
    const fields = hotel.fields;
    const available = fields.available.confirmed ? fields.available.value : null;
    const sold = fields.sold.confirmed ? fields.sold.value : null;
    const revenue = fields.revenue.confirmed ? fields.revenue.value : null;
    const validAvailable = Number.isInteger(available) && available > 0;
    const validSold = Number.isInteger(sold) && sold >= 0 && (!validAvailable || sold <= available);
    const validRevenue = Number.isFinite(revenue) && revenue >= 0;
    const conflict = validSold && sold === 0 && validRevenue && revenue > 0;
    return {
      occ: validAvailable && validSold && !conflict ? sold / available : null,
      adr: validSold && sold > 0 && validRevenue ? revenue / sold : null,
      revpar: validAvailable && validRevenue && !conflict ? revenue / available : null,
      ready: validAvailable && validSold && validRevenue && !conflict,
      missing: Object.keys(fieldLabels).filter((key) => !fields[key].confirmed || fields[key].value === null).map((key) => fieldLabels[key]),
      conflict
    };
  }
  function confirmField(hotel, role, key, raw) {
    requireAccess(hotel, role);
    if (role !== "owner") throw new Error("顾问未获代确认授权，请由业主逐项确认。");
    if (!Object.hasOwn(fieldLabels, key)) throw new Error("未知字段。");
    if (typeof raw !== "string" || raw.trim() === "") throw new Error("请填写数值；未知值不能填为零。");
    const value = Number(raw);
    if (!Number.isFinite(value) || value < 0) throw new Error("请填写有效的非负数值。");
    if (key !== "revenue" && !Number.isInteger(value)) throw new Error("房晚必须为整数。");
    if (key === "available" && value <= 0) throw new Error("可售房晚必须大于零。");
    const proposed = clone(hotel);
    proposed.fields[key] = { value, confirmed: true };
    const a = proposed.fields.available.value;
    const s = proposed.fields.sold.value;
    const r = proposed.fields.revenue.value;
    if (a !== null && s !== null && s > a) throw new Error("售出房晚不能超过可售房晚，请先核对资料。");
    if (s === 0 && r !== null && r > 0) throw new Error("零售出房晚但收入大于零，请核对会计口径。");
    const current = hotel.fields[key];
    if (current.confirmed && current.value === value) return false;
    hotel.fields[key] = { value, confirmed: true };
    hotel.revision += 1;
    return true;
  }
  function currentReport(hotel) {
    return hotel.reports.findLast((report) => report.revision === hotel.revision) || null;
  }
  function createReport(hotel, role) {
    requireAccess(hotel, role);
    if (role !== "consultant") throw new Error("报告初稿由顾问生成。");
    if (!getMetrics(hotel).ready) throw new Error("基础数据尚未逐项确认，不能生成报告初稿。");
    if (currentReport(hotel)) throw new Error("当前输入版本已有报告；请继续审核或交付。");
    const report = {
      id: `DEMO-${hotel.id}-${String(hotel.reports.length + 1).padStart(3, "0")}`,
      version: hotel.reports.length + 1, revision: hotel.revision, status: "draft",
      createdAt: new Date().toISOString(), snapshot: clone(hotel.fields),
      metrics: getMetrics(hotel), events: [],
      actions: ["补充同口径的竞品资料，核验可比性。", "核对渠道合同与费用口径，保留结算凭证。", "记录后续经营行动及观察结果，由顾问人工复盘。"]
    };
    hotel.reports.push(report);
    return report;
  }
  function transitionReport(hotel, role, action) {
    requireAccess(hotel, role);
    if (role !== "consultant") throw new Error("只有顾问可以审核和交付报告。");
    const report = currentReport(hotel);
    if (!report) throw new Error("请先生成当前输入版本的报告。");
    const transitions = {
      approve: { from: "draft", to: "approved" },
      return: { from: "draft", to: "returned" },
      revise: { from: "returned", to: "draft" },
      deliver: { from: "approved", to: "delivered" }
    };
    const next = transitions[action];
    if (!next || report.status !== next.from) throw new Error("报告状态不允许此操作。");
    if (action === "revise") {
      const revised = clone(report);
      revised.id = `DEMO-${hotel.id}-${String(hotel.reports.length + 1).padStart(3, "0")}`;
      revised.version = hotel.reports.length + 1;
      revised.status = "draft";
      revised.createdAt = new Date().toISOString();
      revised.events = [{ action: "revise", at: revised.createdAt }];
      hotel.reports.push(revised);
      return revised;
    }
    report.status = next.to;
    report.events.push({ action, at: new Date().toISOString() });
    return report;
  }
  function setInvitation(hotel, role, action) {
    if (role !== "owner") throw new Error("请切换业主端处理酒店授权。");
    const allowed = {
      accept: { from: "pending", to: "accepted" },
      expire: { from: "pending", to: "expired" },
      revoke: { from: "accepted", to: "revoked" }
    };
    const next = allowed[action];
    if (!next || hotel.invitation !== next.from) throw new Error("邀请状态不允许此操作；重新演示请重置。");
    hotel.invitation = next.to;
  }
  function calculateScenario(hotel, role, values) {
    requireAccess(hotel, role);
    if (!getMetrics(hotel).ready) throw new Error("请先完成基础数据确认。");
    const c = hotel.channels;
    if (Object.values(c).some((value) => value === null)) throw new Error("渠道收入或费用未知，不能测算。");
    const keys = ["delta", "extraRate", "budget", "discount"];
    if (keys.some((key) => typeof values[key] !== "string" || !values[key].trim())) throw new Error("请显式填写所有情景假设，不以零替代未知。");
    const n = Object.fromEntries(keys.map((key) => [key, Number(values[key])]));
    if (Object.values(n).some((value) => !Number.isFinite(value) || value < 0)) throw new Error("情景假设必须为有效非负数。");
    if (n.extraRate > 88) throw new Error("基础演示费率为 12%，合计佣金比例不能超过 100%。");
    const revenue = c.revenue + n.delta;
    if (n.discount > revenue) throw new Error("酒店承担的折扣不能超过情景收入。");
    const afterDiscount = revenue - n.discount;
    return {
      baseline: c.revenue - c.commission - c.ads,
      net: afterDiscount * (1 - 0.12 - n.extraRate / 100) - c.ads - n.budget,
      assumedRevenue: afterDiscount
    };
  }
  function saveFeedback(hotel, role, reportId, text) {
    requireAccess(hotel, role);

      <div class="card"><h2>您的自设情景</h2><form id="scenario-form"><div class="form-grid">
      <div><label for="delta">假设新增收入（折扣前，元）</label><input id="delta" name="delta" type="number" min="0" step="0.01" placeholder="显式填写，无新增填 0" required></div>
      <div><label for="extraRate">额外佣金（百分点）</label><input id="extraRate" name="extraRate" type="number" min="0" max="88" step="0.01" placeholder="例如 2，无增加填 0" required></div>
      <div><label for="budget">新增投流预算（元）</label><input id="budget" name="budget" type="number" min="0" step="0.01" placeholder="自设预算" required></div>
      <div><label for="discount">新增酒店承担折扣（元）</label><input id="discount" name="discount" type="number" min="0" step="0.01" placeholder="不重复扣基线折扣" required></div></div><div class="button-row"><button type="submit" class="primary">比较情景</button></div><p id="scenario-error" class="form-error" role="alert"></p></form>
      <div id="scenario-result" hidden class="result" aria-live="polite"></div></div></div>`;
  }
  function reportPage(h) {
    const report = M.currentReport(h);
    const owner = state.role === "owner";
    const visible = report && (!owner || report.status === "delivered");
    const content = visible ? `<article class="card report-sheet"><div class="report-watermark">DEMO · 合成数据 · 非正式客户报告</div>
      <div class="section-heading"><h2>${escape(h.name)} · 经营事实报告</h2>${badge(reportLabels[report.status], report.status === "delivered" ? "green" : "amber")}</div>
      <p class="small muted">编号 ${report.id} · 报告 v${report.version} · 输入 v${report.revision} · ${date(report.createdAt)} · 规则：未冻结</p>
      <h3>一句话结论</h3><p>本期基础指标可计算；竞品资料与已批准规则不足，目前不能判断提价空间。</p>
      <div class="grid"><div><label>出租率</label><strong class="metric-value">${percent(report.metrics.occ)}</strong></div><div><label>平均成交房价</label><strong class="metric-value">${money(report.metrics.adr)}</strong></div><div><label>RevPAR</label><strong class="metric-value">${money(report.metrics.revpar)}</strong></div></div>
      <p class="small muted">依据：本报告输入快照中的可售 ${report.snapshot.available.value} 房晚、售出 ${report.snapshot.sold.value} 房晚、收入 ${money(report.snapshot.revenue.value)}。置信度：不适用（不输出增长或提价结论）。</p>
      <h3>下一步 · 最多三条行动</h3>${report.actions.map((action, i) => `<div class="action-item"><span>0${i + 1}</span><div>${escape(action)}</div></div>`).join("")}
      <p class="small muted" style="margin-top:20px">基于用户提供的合成数据，不构成收益保证。重大经营决策需专业判断和独立行动授权。</p>
      <div class="button-row no-print">${owner ? button("打印演示报告", "print", "secondary") : report.status === "draft" ? button("审核通过（模拟）", "approve") + button("退回核对", "return", "secondary") : report.status === "returned" ? button("新建修订版", "revise") : report.status === "approved" ? button("交付至业主端（模拟）", "deliver") : button("打印演示报告", "print", "secondary")}</div></article>` :
      `<div class="card empty"><h2>${owner ? "尚无当前版本已交付报告" : "当前输入版本尚无报告"}</h2><p class="muted">${owner ? "资料修改后需顾问重新审核交付；阶段性结果不等于正式报告。" : "先完成业主字段确认，再生成基于快照的演示报告。"}</p>${owner ? go("查看阶段性结果", "diagnosis") : button("生成报告初稿", "create-report", "primary", M.getMetrics(h).ready ? "" : "disabled")}<p id="report-error" role="alert" class="form-error"></p></div>`;
    return `${heading("从审核到交付，每一步有记录。", "审核、交付和打印均为本地模拟，不会向客户发送文件。", "报告生命周期")}
      ${content}${owner && visible ? `<div class="card no-print"><h2>经营行动反馈</h2><form id="feedback-form" data-report="${report.id}"><label for="feedback">您做了什么？还缺少什么？</label><textarea id="feedback" name="feedback" rows="4" maxlength="500" placeholder="仅填写虚构演示记录，不输入真实酒店资料。" required></textarea><div class="button-row"><button type="submit" class="primary">保存演示反馈</button></div><p id="feedback-error" class="form-error" role="alert"></p></form></div>` : ""}
      <div class="grid two no-print"><div class="card"><h2>版本与交付记录</h2>${h.reports.length ? `<div class="timeline">${h.reports.filter((r) => !owner || r.status === "delivered").map((r) => `<p><b>${r.id} · 输入 v${r.revision}</b><br>${reportLabels[r.status]}${r.revision !== h.revision ? " · 历史版本，不沿用审核" : ""}<br><span class="muted">${r.events.map((e) => `${escape(eventLabels[e.action])} ${date(e.at)}`).join("<br>") || "已生成初稿"}</span></p>`).join("") || "<p>暂无已交付版本。</p>"}</div>` : "<p class='muted'>暂无记录。</p>"}</div><div class="card"><h2>人工跟进记录</h2>${h.feedback.length ? h.feedback.map((f) => `<p class="small muted">${escape(f.reportId)} · ${date(f.at)}</p><p class="feedback-text">${escape(f.text)}</p>`).join("") : "<p class='muted'>尚无业主反馈。记录不是执行证明，也不自动进行因果归因。</p>"}</div></div>`;
  }
  function render(focus = false) {
    const h = hotel();
    const items = navItems[state.role];
    if (!items.some(([key]) => key === state.page)) state.page = "home";
    document.body.classList.toggle("owner", state.role === "owner");
    document.querySelectorAll("[data-role]").forEach((el) => el.setAttribute("aria-pressed", String(el.dataset.role === state.role)));
    document.getElementById("hotel-picker").innerHTML = state.hotels.map((item) => `<option value="${item.id}" ${item.id === h.id ? "selected" : ""}>${escape(item.name)} · ${item.id}</option>`).join("");
    document.getElementById("hotel-caption").textContent = `${h.caseLabel} · ${invitationLabels[h.invitation]}`;
    document.getElementById("navigation").innerHTML = items.map(([key, label], index) => `<button type="button" data-action="navigate" data-page="${key}" class="${key === state.page ? "active" : ""}" ${key === state.page ? 'aria-current="page"' : ""}><span class="nav-number">0${index + 1}</span>${label}</button>`).join("");
    const pages = { home, hotel: hotelPage, authorization, data: dataPage, diagnosis, scenario, report: reportPage };
    const main = document.getElementById("main");
    main.innerHTML = (!M.canAccess(h, state.role) && state.page !== "home" ? blocked(h) : pages[state.page](h)) + `<p class="footer-note">栖衡 v0.1 · 双端静态交互原型 · 进度仅保存于本浏览器 · 不连接后台或第三方服务</p>`;
    persist();
    if (focus) main.focus({ preventScroll: true });
  }
  function navigate(page) { state.page = page; render(true); }
  document.addEventListener("click", (event) => {
    const roleButton = event.target.closest("[data-role]");
    if (roleButton) { state.role = roleButton.dataset.role; state.page = "home"; render(true); return; }
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    try {
      if (action === "navigate") { navigate(target.dataset.page); return; }
      if (action === "select-hotel") { state.hotelId = target.dataset.id; navigate("hotel"); return; }
      if (action === "owner-data" || action === "owner-authorization") { state.role = "owner"; navigate(action === "owner-data" ? "data" : "authorization"); return; }
      if (["accept", "expire", "revoke"].includes(action)) {
        M.setInvitation(hotel(), state.role, action);
        render(); toast(`已模拟：${invitationLabels[hotel().invitation]}`); return;
      }
      if (action === "create-report") M.createReport(hotel(), state.role);
      else if (["approve", "return", "revise", "deliver"].includes(action)) M.transitionReport(hotel(), state.role, action);
      else if (action === "print") {
        const r = M.currentReport(hotel());
        if (!M.canAccess(hotel(), state.role) || r?.status !== "delivered") throw new Error("仅当前已交付演示报告可以打印。");
        window.print();
        toast("已打开打印预览；不代表文件已导出、下载或发送。"); return;
      } else return;
      render(); toast(action === "deliver" ? "已模拟交付，可切换业主端查看。" : "演示报告状态已更新。");
    } catch (error) { toast(error.message); }
  });
  document.addEventListener("submit", (event) => {
    event.preventDefault();
    const form = event.target;
    const data = Object.fromEntries(new FormData(form));
    let errorId;
    try {
      if (form.classList.contains("field-form")) {
        errorId = "field-error";
        const changed = M.confirmField(hotel(), state.role, form.dataset.field, data.value);
        render(); toast(changed ? "已逐项确认，新输入版本已保存；旧报告不变。" : "数值与确认状态未变。");
      } else if (form.id === "intake-form") {
        errorId = "intake-error";
        if (!data.consent) throw new Error("请先勾选本地演示保存告知。");
        if (state.role !== "owner") throw new Error("请由业主提交首诊。");
        hotel().consent = true;
        hotel().intake = { stage: data.stage, goal: data.goal };
        render(); toast("演示首诊已保存；适用性仍需人工评估。");
      } else if (form.id === "scenario-form") {
        errorId = "scenario-error";
        const result = M.calculateScenario(hotel(), state.role, data);
        document.getElementById(errorId).textContent = "";
        const el = document.getElementById("scenario-result");
        el.hidden = false;
        el.innerHTML = `<label>情景渠道净收益（估算）</label><strong class="metric-value">${money(result.net)}</strong><p>相较当前基线：${money(result.net - result.baseline)}</p><p class="small muted">情景折后收入 ${money(result.assumedRevenue)}。假设全部成立才有此结果，不代表酒店利润或因果新增收益。</p>`;
      } else if (form.id === "feedback-form") {
        errorId = "feedback-error";
        M.saveFeedback(hotel(), state.role, form.dataset.report, data.feedback);
        render(); toast("虚构行动反馈已保存在本地。");
      }
    } catch (error) {
      if (errorId) document.getElementById(errorId).textContent = error.message;
      else toast(error.message);
      if (form.id === "scenario-form") document.getElementById("scenario-result").hidden = true;
    }
  });
  document.getElementById("hotel-picker").addEventListener("change", (event) => {
    state.hotelId = event.target.value; render(true);
  });
  document.querySelector(".brand").addEventListener("click", (event) => { event.preventDefault(); navigate("home"); });
  const dialog = document.getElementById("reset-dialog");
  document.getElementById("reset").addEventListener("click", () => dialog.showModal());
  document.getElementById("cancel-reset").addEventListener("click", () => dialog.close());
  document.getElementById("confirm-reset").addEventListener("click", () => {
    state = M.createState(); dialog.close(); render(true); toast("仅本 Demo 的进度已重置。");
  });
  render();
})();
</script>
</body>
</html>
